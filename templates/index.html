<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crowd Safety Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f1115;
            color: #e5e7eb;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }
        .panel {
            background: rgba(31, 34, 43, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: all 0.2s;
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="h-screen w-screen p-6 flex flex-col gap-6">
    <!-- HEADER -->
    <header class="flex justify-between items-center h-16 panel px-6">
        <div class="flex items-center gap-4">
            <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30">CS</div>
            <div>
                <h1 class="text-xl font-semibold tracking-tight text-white">Crowd Safety Monitor</h1>
                <p class="text-xs text-gray-400">Enterprise Video Analytics Platform</p>
            </div>
        </div>
        
        <!-- UPLOAD SECTION -->
        <div class="flex items-center gap-4">
            <span id="upload_status" class="text-xs text-gray-400 font-medium"></span>
            <label class="glass-btn px-4 py-2 cursor-pointer text-sm font-medium flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Upload Video Feed
                <input type="file" id="video_upload" class="hidden" accept=".mp4,.avi,.mov" onchange="uploadVideo()">
            </label>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex gap-6 h-[calc(100vh-8rem)]">
        
        <!-- VIDEO FEED (LEFT) -->
        <div class="flex-1 panel flex flex-col overflow-hidden relative group">
            <div class="absolute top-4 left-4 z-10 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 text-xs font-medium flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                LIVE FEED
            </div>
            
            <img src="/video_feed" class="w-full h-full object-contain bg-black/40" alt="CCTV Feed">
        </div>

        <!-- TELEMETRY (RIGHT) -->
        <div class="w-[380px] panel p-6 flex flex-col gap-6 overflow-hidden">
            <h2 class="text-sm font-semibold tracking-wide text-gray-400 uppercase border-b border-white/5 pb-3">Real-time Telemetry</h2>
            
            <div class="flex flex-col items-center justify-center py-6 bg-black/20 rounded-xl border border-white/5">
                <div class="text-sm font-medium text-gray-400 mb-2">Overall Risk Score</div>
                <div id="risk_score" class="text-7xl font-bold tracking-tight text-white transition-colors duration-300">0.0</div>
                <div id="risk_cat" class="text-sm font-semibold tracking-wider mt-3 px-3 py-1 rounded-full bg-white/10 text-white transition-colors duration-300">SAFE</div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-black/20 p-4 rounded-xl border border-white/5">
                    <div class="text-xs text-gray-400 mb-1">Density Level</div>
                    <div id="density" class="text-xl font-semibold text-white">0.0%</div>
                </div>
                <div class="bg-black/20 p-4 rounded-xl border border-white/5">
                    <div class="text-xs text-gray-400 mb-1">Congestion</div>
                    <div id="congestion" class="text-xl font-semibold text-white">0.0%</div>
                </div>
                <div class="bg-black/20 p-4 rounded-xl border border-white/5">
                    <div class="text-xs text-gray-400 mb-1">Duration</div>
                    <div id="duration" class="text-xl font-semibold text-white">0.0%</div>
                </div>
                <div class="bg-black/20 p-4 rounded-xl border border-white/5">
                    <div class="text-xs text-gray-400 mb-1">Avg Speed</div>
                    <div id="speed" class="text-xl font-semibold text-white">0.0 px/f</div>
                </div>
            </div>

            <div id="asphyxia_box" class="mt-auto rounded-xl border border-white/5 bg-black/20 p-5 transition-all duration-300">
                <div class="flex justify-between items-center mb-2">
                    <div class="text-sm font-medium text-gray-300">Compressive Asphyxia Risk</div>
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div class="flex items-end gap-2">
                    <div id="asphyxia" class="text-3xl font-bold text-white">0.0%</div>
                    <div id="asphyxia_status" class="text-xs font-medium text-gray-400 mb-1">Normal</div>
                </div>
            </div>
            
            <div id="footer_stats" class="text-[0.65rem] text-gray-500 text-center uppercase tracking-widest mt-2 border-t border-white/5 pt-4">
                Connecting to telemetry stream...
            </div>
        </div>
    </div>

    <script>
        async function uploadVideo() {
            const fileInput = document.getElementById('video_upload');
            const file = fileInput.files[0];
            if (!file) return;

            const statusText = document.getElementById('upload_status');
            statusText.innerText = "Processing video...";
            statusText.className = "text-xs text-blue-400 font-medium animate-pulse";

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if(result.status === "success") {
                    statusText.innerText = file.name;
                    statusText.className = "text-xs text-green-400 font-medium";
                }
            } catch (err) {
                statusText.innerText = "Upload failed";
                statusText.className = "text-xs text-red-400 font-medium";
            }
        }

        const ws = new WebSocket("ws://" + window.location.host + "/ws");
        
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (!data || Object.keys(data).length === 0) return;
            
            // Elements
            const riskEl = document.getElementById("risk_score");
            const catEl = document.getElementById("risk_cat");
            const asphyxiaBox = document.getElementById("asphyxia_box");
            
            // Update values
            riskEl.innerText = (data['R_z[n]'] || 0).toFixed(1);
            catEl.innerText = (data['Risk_Category'] || "SAFE").toUpperCase();
            
            document.getElementById("density").innerText = (data['D_smoothed_z[n]'] || 0).toFixed(1) + "%";
            document.getElementById("congestion").innerText = (data['C_smoothed_z[n]'] || 0).toFixed(1) + "%";
            document.getElementById("duration").innerText = (data['T_z[n]'] || 0).toFixed(1) + "%";
            document.getElementById("speed").innerText = (data['Tracked_Speed_z[n]'] || 0).toFixed(2) + " px/f";
            
            const asphyxiaRisk = data['Suffocation_Risk_z[n]'] || 0;
            document.getElementById("asphyxia").innerText = asphyxiaRisk.toFixed(1) + "%";
            
            document.getElementById("footer_stats").innerText = "FPS: " + (data['fps'] || 0).toFixed(1) + "  •  ACTIVE ZONE: " + data['zone'];
            
            // Dynamic Styling based on Risk Category
            let color = "#10b981"; // emerald-500
            let bgClass = "bg-emerald-500/20 text-emerald-400";
            
            if (data['Risk_Category'] === "High Risk") {
                color = "#ef4444"; // red-500
                bgClass = "bg-red-500/20 text-red-400";
            } else if (data['Risk_Category'] === "Warning") {
                color = "#f59e0b"; // amber-500
                bgClass = "bg-amber-500/20 text-amber-400";
            }
            
            riskEl.style.color = color;
            catEl.className = `text-xs font-semibold tracking-wider mt-3 px-3 py-1 rounded-full ${bgClass} transition-colors duration-300`;
            
            if (asphyxiaRisk > 50) {
                asphyxiaBox.className = "mt-auto rounded-xl border border-red-500/50 bg-red-500/10 p-5 transition-all duration-300";
                document.getElementById("asphyxia").className = "text-3xl font-bold text-red-400";
                document.getElementById("asphyxia_status").innerText = "CRITICAL WARNING";
                document.getElementById("asphyxia_status").className = "text-xs font-bold text-red-400 mb-1 animate-pulse";
            } else {
                asphyxiaBox.className = "mt-auto rounded-xl border border-white/5 bg-black/20 p-5 transition-all duration-300";
                document.getElementById("asphyxia").className = "text-3xl font-bold text-white";
                document.getElementById("asphyxia_status").innerText = "Normal";
                document.getElementById("asphyxia_status").className = "text-xs font-medium text-gray-400 mb-1";
            }
        };
    </script>
</body>
</html>
